id: eu-roadmap
name: "EU Coordinated Implementation Roadmap"
authority: "NIS Cooperation Group / European Commission"
jurisdiction: EU
pack_version: "0.1.0"
applicability: >-
  A Commission Recommendation and a Member State planning roadmap — non-binding
  on operators by definition (TFEU Art. 288). Every rule here caps at WARN. If
  NIS2 or DORA pull these dates into binding obligations for in-scope entities,
  that warrants a separate pack rather than a change here.
notes: "STUB. Roadmap published 2025-06-23."

rules:
  - id: eu-high-risk-2030
    description: >-
      High-risk use cases — critical infrastructure, utilities, telecom,
      finance, government — secured with PQC as soon as possible and no later
      than end of 2030.
    binding: guideline_recommendation
    status: needs_verification
    source_url: "https://digital-strategy.ec.europa.eu/en/library/coordinated-implementation-roadmap-transition-post-quantum-cryptography"
    source_title: "A Coordinated Implementation Roadmap for the Transition to Post-Quantum Cryptography"
    source_edition: "2025-06-23"
    last_verified: 2026-09-05
    deadline: 2030-12-31
    deadline_state: complete
    applies_to:
      purpose: [key-agreement, encryption, signature]
      quantum_status: [broken-by-shor]
      system_category: ["high-risk"]
    rationale: unstated
    verdict: warn
    open_question: >-
      Confirm the roadmap's own sector list so the config enum matches. Like the
      CNSA categories, 'high-risk use case' is not CBOM-derivable — undeclared
      means INDETERMINATE, not a pass.

  - id: eu-transition-start-2026
    description: "Member States should start transitioning by end of 2026."
    binding: guideline_recommendation
    status: needs_verification
    source_url: "https://digital-strategy.ec.europa.eu/en/library/coordinated-implementation-roadmap-transition-post-quantum-cryptography"
    source_title: "EU Coordinated Implementation Roadmap"
    last_verified: 2026-09-05
    deadline: 2026-12-31
    deadline_state: transition_start
    applies_to:
      quantum_status: [broken-by-shor]
    rationale: unstated
    verdict: info
    open_question: "Confirm whether this binds Member States only, or operators too."

  - id: eu-remainder-2035
    description: >-
      Transition completed for as many systems as practically feasible by 2035.
    binding: guideline_recommendation
    status: needs_verification
    source_url: "https://digital-strategy.ec.europa.eu/en/library/coordinated-implementation-roadmap-transition-post-quantum-cryptography"
    source_title: "EU Coordinated Implementation Roadmap"
    last_verified: 2026-09-05
    deadline: 2035-12-31
    deadline_state: complete
    applies_to:
      quantum_status: [broken-by-shor]
    rationale: unstated
    verdict: warn
    open_question: >-
      'As far as feasible' is not a hard deadline. Confirm the wording before
      this ever produces a blocking verdict.
