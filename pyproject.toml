[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbomctl"
version = "0.1.4"
description = "Evaluate a CycloneDX CBOM against multiple national post-quantum policies and report where their verdicts contradict."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Sadjad Asadi" }]
keywords = [
  "cbom", "cyclonedx", "sbom", "post-quantum", "pqc", "quantum-safe",
  "compliance", "policy-as-code", "ml-kem", "ml-dsa", "cnsa-2.0",
  "nist-ir-8547", "bsi", "anssi", "asd",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["typer>=0.12", "pydantic>=2.7", "pyyaml>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
test = ["pytest>=8.0", "jsonschema>=4.21"]

[project.scripts]
cbomctl = "cbomctl.cli:app"

[project.urls]
Homepage = "https://github.com/lvlrSajjad/cbomctl"
Documentation = "https://lvlrSajjad.github.io/cbomctl/"
Source = "https://github.com/lvlrSajjad/cbomctl"
Issues = "https://github.com/lvlrSajjad/cbomctl/issues"
Changelog = "https://github.com/lvlrSajjad/cbomctl/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cbomctl"]

# The packs are a standalone artifact at the repo root so other tools can
# consume them, but they must also ship inside the wheel or an installed
# cbomctl has no rules. Mapped in rather than duplicated.
[tool.hatch.build.targets.wheel.force-include]
"policy-packs/packs" = "cbomctl/packs"

[tool.hatch.build.targets.sdist]
include = ["src/", "policy-packs/", "tests/", "docs/", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works in a fresh checkout without `pip install -e .` first.
# Without it the suite only ran for people who already had the package
# installed or who happened to export PYTHONPATH -- which is everyone who
# built it and nobody who just cloned it.
pythonpath = ["src"]
